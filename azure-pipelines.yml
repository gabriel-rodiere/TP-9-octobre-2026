# ==============================================================================
# Pipeline Azure DevOps – Projet Fil Rouge (Boutique en ligne)
# Stages : CI (Build & Tests) -> Quality Gates (JaCoCo) -> Package (Docker) -> Deploy Dev -> Deploy Prod
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - '**.md'
      - '.github/**'

pr:
  branches:
    include:
      - main
      - develop

variables:
  - name: javaVersion
    value: '17'
  - name: mavenArgs
    value: '-B -ntp'
  - name: sonarCloudServiceConnection
    value: 'SonarCloud'
  - name: sonarOrganization
    value: 'mon-organisation-sonar'
  - name: sonarProjectKey
    value: 'mon-organisation-sonar_boutique-en-ligne'
  - name: dockerRegistryServiceConnection
    value: 'acr-boutique-connection'
  - name: imageRepository
    value: 'boutique-en-ligne'
  - name: containerRegistry
    value: 'crboutiquefilrouge.azurecr.io'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ----------------------------------------------------------------------------
  # STAGE 1 : CI - Compilation, Tests et Génération des Rapports
  # ----------------------------------------------------------------------------
  - stage: CI
    displayName: 'CI : Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Maven Build & Surefire Tests'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Installer Java $(javaVersion)'
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Cache@2
            displayName: 'Cache des dépendances Maven'
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(HOME)/.m2/repository

          - task: SonarCloudPrepare@3
            displayName: 'Préparer SonarCloud (Configuration & Scanner)'
            inputs:
              SonarCloud: '$(sonarCloudServiceConnection)'
              organization: '$(sonarOrganization)'
              scannerMode: 'Other'
              extraProperties: |
                sonar.projectKey=$(sonarProjectKey)
                sonar.projectName=boutique-en-ligne
                sonar.coverage.jacoco.xmlReportPaths=$(System.DefaultWorkingDirectory)/**/site/jacoco/jacoco.xml
                sonar.java.binaries=**/target/classes

          - script: |
              chmod +x ./mvnw
              ./mvnw clean verify $(mavenArgs) sonar:sonar
            displayName: 'Exécuter Maven verify, JaCoCo et Analyse SonarCloud'

          - task: SonarCloudPublish@3
            displayName: 'Publier les résultats de l’analyse SonarCloud'
            inputs:
              pollingTimeoutSec: '300'

          - task: SonarCloudQualityGate@3
            displayName: 'Quality Gate SonarCloud (Bloquant)'
            inputs:
              qualityGateTimeoutSec: '300'

          - task: PublishTestResults@2
            displayName: 'Publier les résultats de tests Surefire'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publier le rapport de couverture JaCoCo'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/site/jacoco/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/src/main/java/'

  # ----------------------------------------------------------------------------
  # STAGE 2 : Package - Construction de l'image Docker
  # ----------------------------------------------------------------------------
  - stage: Package
    displayName: 'Package : Docker Build'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildDocker
        displayName: 'Build Docker Image (Local)'
        steps:
          - script: |
              docker build -t $(imageRepository):$(tag) -t $(imageRepository):latest -f $(dockerfilePath) .
            displayName: 'Build de l’image Docker'

          - publish: $(Build.SourcesDirectory)/postman
            artifact: postman-tests
            displayName: 'Publier la collection Postman pour les tests E2E'

  # ----------------------------------------------------------------------------
  # STAGE 4 : Deploy Dev - Déploiement Staging & Smoke Tests Newman (Désactivé si pas d'infra)
  # ----------------------------------------------------------------------------
  - stage: DeployDev
    displayName: 'CD : Déploiement Environnement Dev'
    dependsOn: Package
    condition: false # Activer dès que l'infrastructure Azure est provisionnée
    jobs:
      - deployment: DeployToDev
        displayName: 'Déploiement Azure Container App (Dev)'
        environment: 'filrouge-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Déploiement de l'image $(containerRegistry)/$(imageRepository):$(tag) sur l'environnement DEV..."
                  displayName: 'Déployer conteneur Dev'

                - task: Npm@1
                  displayName: 'Installer Newman (Postman CLI)'
                  inputs:
                    command: 'custom'
                    customCommand: 'install -g newman'

                - script: |
                    newman run $(Pipeline.Workspace)/postman-tests/boutique-en-ligne.postman_collection.json \
                      --env-var "baseUrl=http://dev.boutique.internal:8080"
                  displayName: 'Exécuter les Smoke Tests Postman'

  # ----------------------------------------------------------------------------
  # STAGE 5 : Deploy Prod - Déploiement Production avec Approbation (Désactivé si pas d'infra)
  # ----------------------------------------------------------------------------
  - stage: DeployProd
    displayName: 'CD : Déploiement Production'
    dependsOn: DeployDev
    condition: false # Activer dès que l'infrastructure Azure est provisionnée
    jobs:
      - deployment: DeployToProd
        displayName: 'Déploiement Azure Container App (Production)'
        environment: 'filrouge-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Déploiement en Production de $(containerRegistry)/$(imageRepository):$(tag)..."
                  displayName: 'Déployer conteneur Production'
